name: deploy-shard-from-private-src

# Shard CDN : publie ~900 Mo d'audio sur GitHub Pages SANS les commiter.
# Les .m4a sont checkout depuis le repo privé fox3000foxy/podcast-src
# (sparse, shard N uniquement) dans le workspace éphémère du runner,
# assemblés dans site/files/, puis déployés via l'artifact github-pages.
# Aucun .m4a n'est jamais commité sur ce repo public.
#
# Déclenché par repository_dispatch (event-type: deploy-shard) depuis
# podcast-src, avec client_payload.shard = numéro de CE shard.
# Secrets : SRC_READ_TOKEN (PAT Contents read sur podcast-src).

on:
  repository_dispatch:
    types: [deploy-shard]
  workflow_dispatch:
    inputs:
      src_ref:
        description: 'Ref of podcast-src to deploy'
        required: false
        default: 'master'
      shard:
        description: 'Shard number served by this repo'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-shard
  cancel-in-progress: false

env:
  SHARD: ${{ github.event.client_payload.shard || inputs.shard }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manifest + script from private src
        uses: actions/checkout@v4
        with:
          repository: fox3000foxy/podcast-src
          token: ${{ secrets.SRC_READ_TOKEN }}
          ref: ${{ github.event.client_payload.sha || inputs.src_ref }}
          path: src
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            *.py
            *.json
          sparse-checkout-cone-mode: false

      - name: Materialize shard audio (ls-tree + cat-file, exact blobs)
        run: |
          set -euo pipefail
          mkdir -p audio
          cd src
          python3 - <<'PYEOF2'
          import io, json, os, subprocess, tarfile
          tracks = json.load(open('tracks.json', encoding='utf-8'))
          shard = int(os.environ['SHARD'])
          want = sorted(t['file'] for t in tracks if t.get('shard') == shard)
          print(f'shard {shard}: {len(want)} files')
          # ls-tree -z : paths exacts (aucun glob, crochets/parenthèses
          # OK). Puis UN SEUL git cat-file --batch (rapide) au lieu d'un
          # appel par blob (lent sur clone partiel).
          args = ['git', 'ls-tree', '-z', 'HEAD', '--'] + want
          out = subprocess.run(args, capture_output=True, check=True).stdout
          entries = out.rstrip(b'\0').split(b'\0') if out.strip(b'\0') else []
          assert len(entries) == len(want), f"ls-tree returned {len(entries)}/{len(want)}"
          dest = os.environ['GITHUB_WORKSPACE'] + '/audio'
          batch = subprocess.run(
              ['git', 'cat-file', '--batch'],
              input=b''.join(
                  e.split(b'\t')[0].split(b' ')[2] + b'\n' for e in entries),
              capture_output=True, check=True).stdout
          pos, done = 0, 0
          for e in entries:
              _meta, name = e.split(b'\t')
              nl = batch.index(b'\n', pos)
              _sha, typ, size = batch[pos:nl].split(b' ')
              pos = nl + 1
              blob = batch[pos:pos + int(size)]
              pos += int(size) + 1
              assert typ == b'blob', f"unexpected {typ} for {name}"
              with open(os.path.join(dest, name.decode('utf-8')), 'wb') as fh:
                  fh.write(blob)
              done += 1
          print(f"materialized {done} files")
          PYEOF2

      - name: Assemble static site (shard audio + fragment feed)
        run: |
          set -euo pipefail
          mkdir -p site/files
          python3 - <<'EOF'
          import os, shutil
          files = open('/tmp/shard-files.txt', encoding='utf-8').read().splitlines()
          files = open('/tmp/shard-files.txt', encoding='utf-8').read().splitlines()
          for f in files:
              shutil.copy(os.path.join(os.environ['GITHUB_WORKSPACE'], 'audio', f), f"site/files/{f}")
          print(f"copied {len(files)} files")
          EOF
          python3 src/build-feed.py --manifest src/tracks.json \
            --only-shard "$SHARD" \
            --shard-base "https://podcast-cdn$SHARD.fox3000foxy.com/files" \
            --out site/feed.xml
          touch site/.nojekyll
          echo "audio files: $(ls site/files/*.m4a | wc -l)"
          du -sh site site/files

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
